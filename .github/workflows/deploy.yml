name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref) || 'deploy-production' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  SITE: excalidraw.princechaudhary.xyz
  SERVER_IMAGE: ghcr.io/${{ github.repository_owner }}/excalidraw-server

jobs:
  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run build
        env:
          VITE_API_URL: https://${{ env.SITE }}
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
          retention-days: 7

  server:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/server/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx prisma generate --config prisma7.config.ts
        env:
          DATABASE_URL: postgresql://build:build@localhost/build
      - run: npx tsc --noEmit

  image:
    needs: [web, server]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: apps/server
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.SERVER_IMAGE }}:${{ github.sha }}
            ${{ env.SERVER_IMAGE }}:latest
          cache-from: type=gha,scope=excalidraw-server
          cache-to: type=gha,mode=max,scope=excalidraw-server

  deploy:
    needs: image
    runs-on: ubuntu-24.04
    environment:
      name: production
      url: https://${{ env.SITE }}
    permissions:
      contents: read
      packages: read
    env:
      TARGET: ${{ vars.VM_USER }}@${{ vars.VM_HOST }}
      RELEASE: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: dist

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VM_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ vars.VM_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload files
        run: |
          ssh "$TARGET" "mkdir -p /opt/sites/$SITE/releases/$RELEASE"
          rsync -az --delete dist/ "$TARGET:/opt/sites/$SITE/releases/$RELEASE/"
          scp deploy/docker-compose.yml "$TARGET:/opt/excalidraw/docker-compose.yml"
          scp deploy/excalidraw.caddy deploy/excalidraw-api.caddy "$TARGET:/opt/caddy-sites/"

      - name: Roll out
        run: |
          ssh "$TARGET" bash -s <<SCRIPT
          set -euo pipefail
          cd /opt/excalidraw
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          export SERVER_IMAGE=${{ env.SERVER_IMAGE }}:$RELEASE
          docker compose pull --quiet server
          docker compose up -d --remove-orphans --wait --wait-timeout 180
          docker logout ghcr.io
          cd /opt/sites/$SITE
          ln -sfn releases/$RELEASE current.next
          mv -T current.next current
          ls -1t releases | tail -n +4 | xargs -r -I{} rm -rf releases/{}
          docker exec perps-v2-caddy-1 caddy reload --config /etc/caddy/Caddyfile
          docker image prune -f
          docker compose ps
          SCRIPT

      - name: Smoke test
        run: |
          for i in $(seq 1 20); do
            if curl -fsS "https://$SITE/api/health" >/dev/null && curl -fsS "https://$SITE/" | grep -q '<div id="root"'; then echo ok; exit 0; fi
            sleep 6
          done
          echo "Site did not become healthy"; exit 1
